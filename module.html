<!--
  Node-RED loads this file beside module.js. The editor implementation lives in
  resources/ so the runtime and browser responsibilities remain separate.
-->
<link
  rel="stylesheet"
  type="text/css"
  href="resources/node-red-contrib-module/module-editor.css"
/>
<script
  type="text/javascript"
  src="resources/node-red-contrib-module/module-intellisense.js"
></script>
<script
  type="text/javascript"
  src="resources/node-red-contrib-module/reference-scanner.js"
></script>
<script
  type="text/javascript"
  src="resources/node-red-contrib-module/module-editor.js"
></script>

<script type="text/html" data-template-name="module">
  <input type="hidden" id="node-input-func" />
  <input type="hidden" id="node-input-noerr" />

  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <div class="form-row">
    <label for="node-input-moduleName"
      ><i class="fa fa-cube"></i> Module Name</label
    >
    <input
      type="text"
      id="node-input-moduleName"
      placeholder="Module Name"
      autocomplete="off"
    />
  </div>

  <div class="form-row" id="module-rename-references-row">
    <label for="node-input-updateReferences"
      ><i class="fa fa-retweet"></i> References</label
    >
    <input type="checkbox" id="node-input-updateReferences" />
    <span id="module-rename-references-label"></span>
  </div>

  <div class="form-row">
    <label for="node-input-outputs"
      ><i class="fa fa-random"></i> Outputs</label
    >
    <input type="text" id="node-input-outputs" class="module-outputs-input" />
  </div>

  <div class="form-row module-tabs-row">
    <ul id="module-tabs"></ul>
  </div>

  <div id="module-tabs-content">
    <div id="module-tab-setup" style="display: none">
      <div class="form-row module-libs-heading">
        <label><i class="fa fa-cubes"></i> Modules</label>
        <span>Import external Node.js modules into this Module.</span>
      </div>
      <div class="form-row" id="node-input-libs-container-row">
        <ol id="node-input-libs-container"></ol>
      </div>
    </div>

    <div id="module-tab-references" style="display: none">
      <div class="module-references-summary">
        <span id="module-reference-count">0 references</span>
        <span>in the current flow configuration</span>
      </div>
      <div class="module-reference-table-wrap">
        <table class="module-reference-table">
          <thead>
            <tr>
              <th>Type</th>
              <th>Flow</th>
              <th>Node</th>
            </tr>
          </thead>
          <tbody id="module-reference-list"></tbody>
        </table>
        <div id="module-reference-empty" class="module-reference-empty">
          No Function or Module nodes currently refer to this module.
        </div>
      </div>
    </div>

    <div id="module-tab-body" style="display: none">
      <div class="form-row node-text-editor-row module-editor-row">
        <div
          class="node-text-editor"
          id="node-input-module-editor"
        ></div>
        <button
          type="button"
          id="node-module-expand-js"
          class="red-ui-button red-ui-button-small module-expand-button"
        >
          <i class="fa fa-expand"></i>
        </button>
      </div>
    </div>
  </div>
</script>

<script type="text/html" data-help-name="module">
  <p>
    Defines a reusable JavaScript module that starts when flows are deployed,
    returns values directly to callers, and can optionally emit messages through
    configured outputs.
  </p>

  <h3>Details</h3>
  <p>
    <b>Module Name</b> is the unique global lookup key. It is independent from
    the optional display <b>Name</b>.
  </p>
  <p>Export an API with CommonJS-style module code:</p>
  <pre>function hello() {
    return "hello";
}

module.exports = { hello };</pre>
  <p>Use it from a normal Function node:</p>
  <pre>const test = global.get("modules").test;
msg.payload = test.hello();
return msg;</pre>

  <h3>Module dependencies</h3>
  <p>
    Module code receives the same live <code>modules</code> object. Use
    <code>const logging = modules.logging;</code> to refer to another module.
  </p>

  <h3>External modules</h3>
  <p>
    Add Node.js modules on the <b>Setup</b> tab. Use the configured import
    variable directly, or call <code>require("module-name")</code>. Only modules
    configured on the Setup tab can be required.
  </p>

  <h3>Outputs</h3>
  <p>
    Set <b>Outputs</b> to zero for a pure library, or configure one or more wired
    outputs. <code>emit(1, msg)</code> sends a message through output 1. Returned
    JavaScript values go only to the caller and never emit automatically.
  </p>

  <h3>Cleanup</h3>
  <p>
    Register one or more synchronous or asynchronous cleanup functions with
    <code>node.onClose(callback)</code>. Timers created with the provided timer
    functions are also cleared automatically.
  </p>
</script>
